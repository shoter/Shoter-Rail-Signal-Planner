name: Release

# Manual only. Run this from the Actions tab when you want to publish whatever
# version currently sits in info.json. No push / tag / schedule triggers.
on:
  workflow_dispatch:
    inputs:
      draft:
        description: "Create the release as a draft instead of publishing it"
        type: boolean
        default: false
      prerelease:
        description: "Mark the release as a pre-release"
        type: boolean
        default: false
      overwrite:
        description: "Replace an existing release/tag for this version instead of failing"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  release:
    name: Build and publish
    # build.ps1 is Windows PowerShell tooling (Compress-Archive, Windows paths).
    runs-on: windows-latest
    permissions:
      contents: write # create the tag, the release and its assets
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------------------
      # Everything below is derived from info.json - no version, mod name or
      # zip name is ever hardcoded here.
      # ---------------------------------------------------------------------
      - name: Read mod metadata from info.json
        id: mod
        run: |
          if (-not (Test-Path -LiteralPath 'info.json')) {
              throw "info.json not found in the repository root."
          }

          # Strip a UTF-8 BOM if present - ConvertFrom-Json chokes on it.
          $raw  = (Get-Content -LiteralPath 'info.json' -Raw) -replace '^\uFEFF', ''
          $info = $raw | ConvertFrom-Json

          $version = "$($info.version)".Trim()
          $name    = "$($info.name)".Trim()
          $title   = "$($info.title)".Trim()

          if ($version -notmatch '^\d+\.\d+\.\d+$') {
              throw "info.json 'version' is '$version'; Factorio requires major.minor.patch."
          }
          if ([string]::IsNullOrWhiteSpace($name)) {
              throw "info.json has no 'name' field."
          }
          if ([string]::IsNullOrWhiteSpace($title)) { $title = $name }

          # build.ps1 writes dist/<mod name>_<version>.zip
          $zip = "dist/${name}_${version}.zip"

          Write-Host "Mod     : $name ($title)"
          Write-Host "Version : $version"
          Write-Host "Tag     : v$version"
          Write-Host "Package : $zip"

          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "version=$version"
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "name=$name"
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "tag=v$version"
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "zip=$zip"
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "release_title=$title v$version"

      # ---------------------------------------------------------------------
      # Done before the build so a missing changelog entry fails fast.
      # ---------------------------------------------------------------------
      - name: Extract changelog entry for this version
        id: changelog
        env:
          MOD_VERSION: ${{ steps.mod.outputs.version }}
        run: |
          $version = $env:MOD_VERSION

          if (-not (Test-Path -LiteralPath 'changelog.txt')) {
              throw "changelog.txt not found in the repository root."
          }

          # Read whole, drop a BOM, normalise CRLF/CR so no stray \r survives.
          $raw   = (Get-Content -LiteralPath 'changelog.txt' -Raw) -replace '^\uFEFF', ''
          $lines = $raw -split "\r?\n"

          # -- Locate the entry -------------------------------------------------
          # Factorio format: entries separated by a long run of dashes, each headed
          # by "Version: x.y.z". Entries are newest-first but we search by name
          # rather than assuming position. The header is matched whole, so 2.0.1
          # can never match 2.0.10 or 12.0.1.
          $entry   = New-Object System.Collections.Generic.List[string]
          $inEntry = $false
          $found   = $false

          foreach ($line in $lines) {
              if ($line -match '^-{5,}\s*$') {          # separator (never a "- item": those are indented)
                  if ($inEntry) { break }
                  continue
              }
              if ($line -match '^\s*Version:\s*(\S+)\s*$') {
                  if ($inEntry) { break }               # next entry began without a separator
                  if ($Matches[1] -eq $version) { $inEntry = $true; $found = $true }
                  continue
              }
              if ($inEntry) { $entry.Add($line) }
          }

          if (-not $found) {
              throw "changelog.txt has no 'Version: $version' entry. Add one before releasing $version."
          }

          # -- Render as markdown -----------------------------------------------
          # "  Bugfixes:"          -> "### Bugfixes"
          # "    - some entry"     -> "- some entry"
          # "      wrapped line"   -> joined onto the bullet above, not a new bullet
          $md            = New-Object System.Collections.Generic.List[string]
          $pending       = ''
          $pendingPrefix = ''
          $bulletIndent  = -1

          foreach ($line in $entry) {
              if ($line -match '^\s*$')        { continue }
              if ($line -match '^\s*Date:\s')  { continue }   # GitHub stamps its own date

              # Category header: ends in a colon and sits shallower than the bullets.
              if ($line -match '^(\s*)([^-\s][^:]*):\s*$' -and
                  ($bulletIndent -lt 0 -or $Matches[1].Length -lt $bulletIndent)) {
                  if ($pending) { $md.Add($pendingPrefix + $pending); $pending = '' }
                  $md.Add('')
                  $md.Add('### ' + $Matches[2].Trim())
                  $bulletIndent = -1
                  continue
              }

              if ($line -match '^(\s*)-\s*(.*)$') {
                  $indent = $Matches[1].Length
                  $text   = $Matches[2].Trim()
                  if ($bulletIndent -lt 0) { $bulletIndent = $indent }
                  if ($pending) { $md.Add($pendingPrefix + $pending) }
                  if ($indent -le $bulletIndent) {
                      $bulletIndent  = $indent
                      $pendingPrefix = '- '
                  } else {
                      $pendingPrefix = '  - '                 # nested sub-item
                  }
                  $pending = $text
                  continue
              }

              # Anything else is a wrapped continuation of the current bullet.
              if ($pending) { $pending = "$pending $($line.Trim())" }
              else          { $md.Add($line.Trim()) }
          }
          if ($pending) { $md.Add($pendingPrefix + $pending) }

          $markdown = (($md -join "`n") -replace "\n{3,}", "`n`n").Trim()
          if ([string]::IsNullOrWhiteSpace($markdown)) {
              throw "The 'Version: $version' entry in changelog.txt is empty; refusing to publish empty notes."
          }

          # Written outside the repo so it can never end up inside the mod package.
          $notesPath = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          Set-Content -LiteralPath $notesPath -Value $markdown -Encoding utf8NoBOM

          Write-Host "----- release notes -----"
          Write-Host $markdown
          Write-Host "-------------------------"

          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "notes_file=$notesPath"

      - name: Build mod package
        env:
          EXPECTED_ZIP: ${{ steps.mod.outputs.zip }}
        run: |
          ./build.ps1 -Verbose

          $zip = $env:EXPECTED_ZIP
          if (-not (Test-Path -LiteralPath $zip)) {
              $present = (Get-ChildItem -Path 'dist' -Filter '*.zip' -ErrorAction SilentlyContinue |
                          ForEach-Object { $_.Name }) -join ', '
              if (-not $present) { $present = '<none>' }
              throw "build.ps1 did not produce '$zip'. Zips in dist/: $present"
          }

          $sizeKb = [math]::Round((Get-Item -LiteralPath $zip).Length / 1KB, 1)
          Write-Host "Built $zip ($sizeKb KB)"

      # Keeps the package retrievable even if the release step is a draft or fails.
      - name: Upload package as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.mod.outputs.name }}_${{ steps.mod.outputs.version }}
          path: ${{ steps.mod.outputs.zip }}
          if-no-files-found: error

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.mod.outputs.tag }}
          RELEASE_TITLE: ${{ steps.mod.outputs.release_title }}
          ZIP: ${{ steps.mod.outputs.zip }}
          NOTES_FILE: ${{ steps.changelog.outputs.notes_file }}
          DRAFT: ${{ inputs.draft }}
          PRERELEASE: ${{ inputs.prerelease }}
          OVERWRITE: ${{ inputs.overwrite }}
        run: |
          # gh is a native exe: on PowerShell 7.4+ a non-zero exit would throw
          # because Actions sets $ErrorActionPreference='Stop'. We want to inspect
          # exit codes ourselves (a missing release is an expected non-zero).
          $PSNativeCommandUseErrorActionPreference = $false

          $overwrite = $env:OVERWRITE -eq 'true'

          gh release view $env:TAG *> $null
          $releaseExists = ($LASTEXITCODE -eq 0)

          gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$env:TAG" *> $null
          $tagExists = ($LASTEXITCODE -eq 0)

          if ($releaseExists -or $tagExists) {
              if (-not $overwrite) {
                  $what = if ($releaseExists) { "A release" } else { "A git tag" }
                  throw "$what named '$env:TAG' already exists. Bump the version in info.json, or re-run this workflow with 'overwrite' enabled."
              }

              if ($releaseExists) {
                  Write-Host "Deleting existing release $env:TAG ..."
                  gh release delete $env:TAG --yes --cleanup-tag
                  if ($LASTEXITCODE -ne 0) { throw "Failed to delete release $env:TAG (exit $LASTEXITCODE)." }
              }

              # --cleanup-tag only runs when a release existed; drop a stray tag too,
              # otherwise the new release would point at the old commit.
              gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$env:TAG" *> $null
              if ($LASTEXITCODE -eq 0) {
                  Write-Host "Deleting existing tag $env:TAG ..."
                  gh api -X DELETE "repos/$env:GITHUB_REPOSITORY/git/refs/tags/$env:TAG" *> $null
                  if ($LASTEXITCODE -ne 0) { throw "Failed to delete tag $env:TAG (exit $LASTEXITCODE)." }
              }
          }

          # Notes go through --notes-file: multi-line changelog text is never
          # interpolated into a command line.
          $ghArgs = @(
              $env:TAG
              $env:ZIP
              '--target', $env:GITHUB_SHA
              '--title', $env:RELEASE_TITLE
              '--notes-file', $env:NOTES_FILE
          )
          if ($env:DRAFT -eq 'true')      { $ghArgs += '--draft' }
          if ($env:PRERELEASE -eq 'true') { $ghArgs += '--prerelease' }

          Write-Host "gh release create $($ghArgs -join ' ')"
          gh release create @ghArgs
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed (exit $LASTEXITCODE)." }

          Write-Host "Released $env:RELEASE_TITLE" -ForegroundColor Green
